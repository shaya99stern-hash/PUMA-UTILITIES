name: Lockfile helper

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile-helper.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Audit patched tree
        run: npm audit --audit-level=critical
      - uses: actions/upload-artifact@v4
        with:
          name: patched-lockfile
          path: package-lock.json
          if-no-files-found: error
