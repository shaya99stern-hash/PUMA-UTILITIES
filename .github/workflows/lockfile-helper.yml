name: Lockfile helper

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile-helper.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Audit patched tree
        run: npm audit --audit-level=critical
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "security: refresh lockfile for Next.js 16.3.6"
          git push origin HEAD:${{ github.head_ref }}
