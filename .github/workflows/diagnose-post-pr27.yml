name: Diagnose post-PR27 tests

on:
  push:
    branches:
      - puma/post-pr27-repair

permissions:
  contents: read

jobs:
  test-file:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/evidence-gating.test.ts
          - tests/monitor-alerts.test.ts
          - tests/pwa-cache-scope.test.ts
          - tests/client-workflow.test.ts
          - tests/client-presentation.test.ts
          - tests/voice-notes.test.ts
          - tests/building-routing.test.ts
          - tests/minimal-companies-ui.test.ts
          - tests/minimal-settings-navigation.test.ts
          - tests/iphone-dashboard-polish.test.ts
          - tests/ios-native-shell.test.ts
          - tests/product-foundation-shell.test.ts
          - tests/puma-brand.test.ts
          - tests/company-lifecycle.test.ts
          - tests/accounts-payable.test.ts
          - tests/final-ui-wiring.test.ts
          - tests/research-engine.test.ts
          - tests/research-productization.test.ts
          - tests/research-strengthening-v2.test.ts
          - tests/research-intelligence-v3.test.ts
          - tests/research-intelligence-v4.test.ts
          - tests/research-intelligence-v5.test.ts
          - tests/product-quality-v6.test.ts
          - tests/product-intelligence-v7.test.ts
          - tests/product-intelligence-v8.test.ts
          - tests/product-quality-v9.test.ts
          - tests/product-intelligence-v10.test.ts
          - tests/product-intelligence-v11.test.ts
          - workers/browser-research/parser.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run selected test
        shell: bash
        run: |
          if [[ "${{ matrix.test }}" == *.mjs ]]; then
            node --test "${{ matrix.test }}"
          else
            npx tsx --test "${{ matrix.test }}"
          fi
