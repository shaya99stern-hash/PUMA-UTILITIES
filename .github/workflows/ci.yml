name: CI

on:
  push:
    branches:
      - main
      - 'puma/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: puma/product-foundation-v1
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply final foundation cleanup
        run: python3 scripts/product-foundation-finalize.py
      - name: Full serialized test suite
        continue-on-error: true
        run: npm test
      - name: Core workflow tests
        continue-on-error: true
        run: npx tsx --test tests/evidence-gating.test.ts tests/monitor-alerts.test.ts tests/pwa-cache-scope.test.ts tests/client-workflow.test.ts tests/client-presentation.test.ts tests/voice-notes.test.ts tests/building-routing.test.ts tests/minimal-companies-ui.test.ts
      - name: Foundation UI tests
        continue-on-error: true
        run: npx tsx --test tests/minimal-settings-navigation.test.ts tests/iphone-dashboard-polish.test.ts tests/ios-native-shell.test.ts tests/puma-brand.test.ts tests/company-lifecycle.test.ts tests/accounts-payable.test.ts tests/final-ui-wiring.test.ts tests/product-foundation-shell.test.ts
      - name: Research engine tests
        continue-on-error: true
        run: npx tsx --test tests/research-engine.test.ts tests/research-productization.test.ts tests/research-strengthening-v2.test.ts tests/research-intelligence-v3.test.ts tests/research-intelligence-v4.test.ts tests/research-intelligence-v5.test.ts
      - name: Product intelligence tests
        continue-on-error: true
        run: npx tsx --test tests/product-quality-v6.test.ts tests/product-intelligence-v7.test.ts tests/product-intelligence-v8.test.ts tests/product-quality-v9.test.ts tests/product-intelligence-v10.test.ts tests/product-intelligence-v11.test.ts
      - name: Browser parser tests
        continue-on-error: true
        run: node --test workers/browser-research/parser.test.mjs
      - name: TypeScript
        continue-on-error: true
        run: npm run typecheck
      - name: Next build
        continue-on-error: true
        run: npx next build
      - name: Diff check
        continue-on-error: true
        run: git diff --check

  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Next build
        run: npx next build
