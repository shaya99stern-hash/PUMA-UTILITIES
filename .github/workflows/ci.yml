name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-diagnose:
    if: github.head_ref == 'puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: puma/product-foundation-v1
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply final foundation cleanup
        run: python3 scripts/product-foundation-finalize.py
      - name: Research engine
        run: npx tsx --test tests/research-engine.test.ts
      - name: Research productization
        run: npx tsx --test tests/research-productization.test.ts
      - name: Research strengthening v2
        run: npx tsx --test tests/research-strengthening-v2.test.ts
      - name: Research intelligence v3
        run: npx tsx --test tests/research-intelligence-v3.test.ts
      - name: Research intelligence v4
        run: npx tsx --test tests/research-intelligence-v4.test.ts
      - name: Research intelligence v5
        run: npx tsx --test tests/research-intelligence-v5.test.ts
