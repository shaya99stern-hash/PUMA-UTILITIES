name: CI

on:
  push:
    branches:
      - main
      - 'puma/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: puma/product-foundation-v1
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply final foundation cleanup
        run: python3 scripts/product-foundation-finalize.py
      - name: Foundation shell tests
        continue-on-error: true
        run: npx tsx --test tests/product-foundation-shell.test.ts tests/minimal-settings-navigation.test.ts tests/iphone-dashboard-polish.test.ts tests/ios-native-shell.test.ts
      - name: Legacy shell regression tests
        continue-on-error: true
        run: npx tsx --test tests/product-quality-v6.test.ts tests/product-intelligence-v7.test.ts
      - name: Full test suite
        continue-on-error: true
        run: npm test
      - name: TypeScript
        continue-on-error: true
        run: npm run typecheck
      - name: Next build
        continue-on-error: true
        run: npx next build
      - name: Diff check
        continue-on-error: true
        run: git diff --check

  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Next build
        run: npx next build
