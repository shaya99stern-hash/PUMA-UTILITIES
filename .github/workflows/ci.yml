name: CI

on:
  push:
    branches:
      - main
      - 'puma/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: puma/product-foundation-v1
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply final foundation cleanup
        run: python3 scripts/product-foundation-finalize.py
      - name: Evidence gating x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/evidence-gating.test.ts || exit 1; done
      - name: Monitor alerts x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/monitor-alerts.test.ts || exit 1; done
      - name: PWA cache scope x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/pwa-cache-scope.test.ts || exit 1; done
      - name: Client workflow x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/client-workflow.test.ts || exit 1; done
      - name: Client presentation x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/client-presentation.test.ts || exit 1; done
      - name: Voice notes x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/voice-notes.test.ts || exit 1; done
      - name: Building routing x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/building-routing.test.ts || exit 1; done
      - name: Minimal companies UI x5
        run: for i in 1 2 3 4 5; do npx tsx --test tests/minimal-companies-ui.test.ts || exit 1; done

  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Next build
        run: npx next build
