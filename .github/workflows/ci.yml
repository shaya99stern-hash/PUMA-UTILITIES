name: CI

on:
  push:
    branches:
      - main
      - 'puma/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  foundation-finalize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: puma/product-foundation-v1
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply final foundation cleanup
        run: python3 scripts/product-foundation-finalize.py
      - name: Full verification
        run: |
          npm test
          npm run typecheck
          npx next build
          git diff --check
      - name: Commit verified cleanup and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show fd3978df5976fd7816c6a2d7df1314836db36f42:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f scripts/product-foundation-finalize.py
          git add -A
          git commit -m "cleanup: remove superseded Puma shell layers"
          git push origin HEAD:puma/product-foundation-v1

  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/puma/product-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Next build
        run: npx next build
